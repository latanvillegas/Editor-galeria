name: Android CI Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate and Stage Debug APK
        run: |
          mkdir -p dist_apk
          echo "Buscando APK de depuración generado..."
          APK_FILE=$(find . -type f -name "*debug*.apk" -o -name "*.apk" | grep -v "/intermediates/" | head -n 1)
          
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No se encontró ningún archivo APK generado en las carpetas de salida de Gradle."
            exit 1
          fi

          echo "APK encontrado con éxito en: $APK_FILE"
          cp "$APK_FILE" dist_apk/app-debug.apk
          ls -lh dist_apk/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist_apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
